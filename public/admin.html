<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0a0a"><title>Panel · Picture Web Dev</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Panel Picture Web Dev — misma identidad que la web: negro, hueso, Open Sans, esquina de marca */
:root{--bg:#0a0a0a;--sf:#151515;--sf2:#1d1d1c;--ln:#2b2b29;--tx:#e7e3dd;--mt:#9b978f;--ok:#5fd69a;--wa:#f2c46d;--er:#ff8a7a;--inv:#0a0a0a;
 --f:'Open Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--rm:20px 0 20px 0;--r:10px;--nav:64px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,34px)}h2{font-size:24px}h3{font-size:17px;letter-spacing:-.02em}
a{color:inherit}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;font-size:16px}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#6d6a64}
:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--tx);outline-offset:1px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mt)}
small,.mt{color:var(--mt)}
.lab{font-weight:700;font-size:12px;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase}
.k-lab{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mt)}
.hid{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* botones */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;background:var(--tx);color:var(--inv);border:1px solid var(--tx);border-radius:var(--r);padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.bt:hover{background:#fff}
.bt.o{background:transparent;color:var(--tx);border-color:var(--ln)}.bt.o:hover{border-color:var(--tx)}
.bt.d{color:var(--er)}.bt.d:hover{border-color:var(--er)}
.bt.s{min-height:34px;padding:6px 12px;font-size:13px}
.bt.wa{background:transparent;color:var(--ok);border-color:#2f5e45}.bt.wa:hover{border-color:var(--ok)}
.bt:disabled{opacity:.5;cursor:default}
.ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:none;cursor:pointer;color:var(--mt);flex:none}.ic:hover{color:var(--er);border-color:var(--er)}

/* login */
#aLogin{min-height:100vh;display:grid;place-items:center;padding:24px}
#aLogin .box{width:min(380px,100%)}
#aLogin img{width:64px;height:64px;margin-bottom:28px}
#aLogin p{color:var(--mt);margin:8px 0 22px}
#aLogin form{display:grid;gap:10px}#le{color:var(--er);min-height:1.4em;font-size:14px}

/* layout */
#aApp{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;border-right:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}.brand img{width:30px;height:30px}
#aNav{flex:1;display:flex;flex-direction:column;gap:2px}
#aNav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:10px;text-align:left;cursor:pointer;color:var(--mt);font-weight:600;font-size:14px}
#aNav button svg{width:18px;height:18px;flex:none}
#aNav button span{flex:1}
#aNav button:hover{color:var(--tx);background:var(--sf)}
#aNav button.a{color:var(--inv);background:var(--tx)}
#aNav b{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--tx);color:var(--inv);font-size:12px;display:inline-grid;place-items:center}
#aNav button.a b{background:var(--inv);color:var(--tx)}
#aNav .out{margin-top:auto}
main{padding:32px clamp(16px,4vw,48px) 60px;min-width:0;max-width:1180px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hint{color:var(--mt);margin:6px 0 24px;max-width:640px}

/* tarjetas y métricas */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rm);padding:20px;min-width:0}
.card+.card{margin-top:16px}
.card h3{margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;min-width:0}
.k b{display:block;font-weight:800;font-size:clamp(20px,2.2vw,26px);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.k small{display:block;margin-top:2px;font-size:12px}
.k.hl{background:var(--tx);color:var(--inv);border-color:var(--tx)}.k.hl .k-lab,.k.hl small{color:#5e5b55}

/* lista "para hacer" */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px}
.td{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.td:hover{border-color:var(--mt)}.td>span:nth-child(2){flex:1;min-width:0}
.w{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:6px;min-width:84px;text-align:center;border:1px solid var(--ln);color:var(--tx)}
.w-Responder{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.w-Entregar{color:var(--er);border-color:#5a2e28}
.w-Cobrar,.w-Abono{color:var(--ok);border-color:#2f5e45}
.w-Renovar{color:var(--wa);border-color:#5c4a24}
.late{color:var(--er)!important;font-weight:700}
.em{color:var(--mt);padding:18px;border:1px dashed var(--ln);border-radius:var(--r);font-size:14px}

/* filtros */
.chs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.ch{background:none;border:1px solid var(--ln);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mt)}
.ch:hover{color:var(--tx);border-color:var(--mt)}.ch.a{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.chs .srch{flex:1 1 220px;max-width:320px;margin-left:auto}

/* filas */
.rw{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) auto auto;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rw:hover,.pr:hover{border-color:var(--mt)}
.rw>div{min-width:0;overflow-wrap:anywhere}
.tg{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--ln);white-space:nowrap}
.e-Nueva{background:var(--tx);color:var(--inv);border-color:var(--tx)}.e-Contactada{color:var(--wa);border-color:#5c4a24}.e-Cotizada{color:#c9b8ff;border-color:#463c66}.e-Aceptada{color:var(--ok);border-color:#2f5e45}.e-Descartada{color:var(--mt)}
.pr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1.1fr) minmax(0,.8fr);gap:18px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:var(--rm);padding:16px 18px;margin-bottom:10px;cursor:pointer}
.pr>div{min-width:0}
.dots{display:flex;gap:4px;margin-bottom:6px}.dots i{flex:1;max-width:28px;height:4px;border-radius:2px;background:var(--ln)}.dots i.on{background:var(--tx)}
.pg{height:4px;background:var(--ln);border-radius:2px;margin:6px 0}.pg i{display:block;height:100%;background:var(--ok);border-radius:2px}
.plan{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mt)}

/* detalle de proyecto */
.bk{background:none;border:0;color:var(--mt);cursor:pointer;font-weight:600;padding:0;margin-bottom:14px}.bk:hover{color:var(--tx)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.dh>div{min-width:0;flex:1 1 300px}
.dh input{font:800 clamp(22px,3vw,30px)/1.15 var(--f);letter-spacing:-.03em;border:1px solid transparent;background:transparent;padding:2px 8px;margin-left:-8px;width:min(640px,100%)}
.dh input:hover,.dh input:focus{border-color:var(--ln);background:var(--sf)}
#sv{color:var(--mt);font-size:13px}
.sp{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px 6px;margin-bottom:14px;overflow-x:auto}
.sp button{flex:1;min-width:104px;background:none;border:0;cursor:pointer;text-align:center;position:relative;padding:0 4px;font-weight:600;font-size:12px;color:var(--mt)}
.sp button i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);font-style:normal;font-weight:700;position:relative;z-index:1}
.sp button.dn i{background:var(--ok);color:var(--inv);border-color:var(--ok)}.sp button.cu i{background:var(--tx);color:var(--inv);border-color:var(--tx)}.sp button.cu{color:var(--tx)}
.sp button:not(:last-child):after{content:"";position:absolute;top:14px;left:calc(50% + 16px);right:calc(-50% + 16px);height:1px;background:var(--ln)}.sp button.dn:not(:last-child):after{background:var(--ok)}
.nxl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.ok2{color:var(--ok);font-weight:700;margin:0 0 18px}
.dg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.hint2{color:var(--mt);font-size:13px;margin:0 0 10px}
.tk{display:flex;gap:10px;align-items:center;padding:6px;border-radius:6px}
.tk input[type=checkbox]{width:18px;height:18px;accent-color:var(--tx);flex:none}
.tk.dn span{text-decoration:line-through;color:var(--mt)}.tk.nx2{background:var(--sf2)}
.tl{border-left:1px solid var(--ln);margin:6px 0 0 4px;padding-left:14px}.tl>div{margin-bottom:12px;font-size:14px;overflow-wrap:anywhere}.tl small{display:block;font-size:12px}
.mn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mn>div{background:var(--bg);border-radius:8px;padding:10px;min-width:0}.mn small{display:block;font-size:11px}.mn b{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pgo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
.pgo>span:first-child{min-width:0;overflow-wrap:anywhere}
.pf2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;margin-top:12px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fg .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx);font-weight:600}.chk input{width:18px;height:18px;accent-color:var(--tx)}
.ba{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.st{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;background:var(--bg);margin-bottom:12px;font-size:14px}
.st b{flex:1}

/* abonos */
.ab{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.ab>div{min-width:0}
.ab .hm{display:flex;gap:3px}.ab .hm i{width:14px;height:14px;border-radius:3px;background:var(--ln)}.ab .hm i.on{background:var(--ok)}

/* ayuda */
.ayu h3{margin:24px 0 8px}.ayu p,.ayu li{color:var(--mt);max-width:680px}.ayu b{color:var(--tx)}.ayu li{margin-bottom:6px}

/* modal */
.md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.md.on{display:flex}
.mb{background:var(--sf);border:1px solid var(--ln);width:min(720px,100%);border-radius:var(--rm);padding:24px}
.mh{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.mh>div{min-width:0}
.x{border:0;background:none;font-size:28px;cursor:pointer;color:var(--mt);line-height:1;padding:0 4px}.x:hover{color:var(--tx)}
.nxt{background:var(--bg);border-left:2px solid var(--tx);padding:10px 14px;margin-bottom:16px;font-size:14px}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;margin:0 0 16px;font-size:14px}.dl dt{color:var(--mt)}.dl dd{margin:0;overflow-wrap:anywhere}.dl a{text-decoration:underline;text-decoration-color:var(--ln);text-underline-offset:3px}
.pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:12px;margin:6px 0 16px;font-size:14px;overflow-wrap:anywhere}
h4{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mt)}
.lnk{display:flex;gap:8px}

#aTs{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--inv);padding:10px 16px;border-radius:8px;z-index:60;display:none;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}

/* tablet */
@media(max-width:1080px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.pr{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dg{grid-template-columns:1fr}}
/* celular: menú abajo */
@media(max-width:760px){
 #aApp{grid-template-columns:1fr}
 aside{position:fixed;z-index:40;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--ln);background:rgba(10,10,10,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
 .brand{display:none}
 #aNav{flex-direction:row;gap:2px}
 #aNav button{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:11px;position:relative;text-align:center}
 #aNav button span{flex:none}
 #aNav button.a{background:var(--sf);color:var(--tx)}
 #aNav b{position:absolute;top:2px;left:calc(50% + 4px);min-width:18px;height:18px;font-size:11px;padding:0 5px}
 #aNav button.a b{background:var(--tx);color:var(--inv)}
 #aNav .out{margin-top:0}
 main{padding:20px 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
 .hd .bt{width:100%}
 .kp{gap:8px}.k{padding:12px}
 .rw{grid-template-columns:minmax(0,1fr) auto}.rw>div:nth-child(2){grid-column:1/-1;order:3}
 .pr{grid-template-columns:1fr;gap:12px}
 .ab{grid-template-columns:minmax(0,1fr) auto}.ab>div:nth-child(3){grid-column:1/-1}.ab .bt{grid-column:1/-1}
 .fg{grid-template-columns:1fr}
 .pf2{grid-template-columns:1fr}
 .mn{grid-template-columns:1fr 1fr 1fr}
 .chs .srch{max-width:none;margin-left:0;flex-basis:100%}
 .md{padding:0;align-items:flex-end}.mb{border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
 .dl{grid-template-columns:90px minmax(0,1fr)}
 .ba .bt{flex:1 1 140px}
 #aTs{bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body id="aRoot">
<div id="aLogin" class="hid"><div class="box"><img src="/brand/estrella-hueso.svg" alt="" width="64" height="64"><h1>Panel</h1><p>Entrá con tu contraseña para ver tus propuestas, proyectos y abonos.</p><form id="lf"><input type="password" id="lp" placeholder="Contraseña" autocomplete="current-password" required><button class="bt">Entrar</button><div id="le" role="alert"></div></form></div></div>
<div id="aApp" class="hid"><aside><div class="brand"><img src="/brand/estrella-hueso.svg" alt="" width="30" height="30"><span class="lab">Picture<br>Web Dev</span></div><nav id="aNav" aria-label="Secciones"></nav></aside><main id="aMain"></main></div>
<div id="aMd" class="md" role="dialog" aria-modal="true"><div class="mb" id="aMb"></div></div><div id="aTs" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),root=document.getElementById('aRoot');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ETAPAS=['Relevamiento','Diseño','Desarrollo','Revisión del cliente','Entregado'],EST=['Nueva','Contactada','Cotizada','Aceptada','Descartada'];
const EHELP={Nueva:'Nadie la miró todavía.',Contactada:'Ya le respondiste al cliente.',Cotizada:'Le mandaste un presupuesto.',Aceptada:'El cliente aceptó: ya es un proyecto.',Descartada:'No va a avanzar.'};
const NEXT={Nueva:'Respondele por WhatsApp o mail y después marcala como «Contactada».',Contactada:'Cuando le mandes el presupuesto, pasala a «Cotizada».',Cotizada:'Si el cliente acepta, convertila en proyecto con el botón de abajo.',Aceptada:'Esta propuesta ya está en tus proyectos.',Descartada:'No va a avanzar. Podés dejarla de registro o borrarla.'};
const TIPOS=['Landing page','Sitio institucional','Sistema a medida','Tienda online','Rediseño de un sitio existente','Otro'];
const PLANES=['Presencia','Negocio','Sistema','A medida'];
const PLAN_ABONO={Presencia:20,Negocio:30,Sistema:35}; // valores del PDF de planes, en USD
const PLAN_DE_TIPO={'Landing page':'Presencia','Sitio institucional':'Negocio','Sistema a medida':'Sistema'};
const TAREAS=['Reunión de relevamiento','Anticipo cobrado','Diseño aprobado','Desarrollo','Contenido cargado','Dominio y hosting','Publicación','Entrega al cliente'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const IC={hoy:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',propuestas:'<path d="M4 4h16v12H8l-4 4z"/>',proyectos:'<path d="M3 7h18v13H3zM8 7V4h8v3"/>',abonos:'<path d="M3 6h18v12H3zM3 10h18M7 15h4"/>',ayuda:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
let P=[],L=[],view='hoy',pid=null,fl='',pf='curso',q='',lq='',logged=false,svt,tipsHidden=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tod=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mes=()=>tod().slice(0,7),diaMes=()=>+tod().slice(8,10);
const nomMes=m=>{const [y,n]=m.split('-');return `${MESES[+n-1]} ${y}`};
const money=(n,m)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:m==='USD'?'USD':'ARS',maximumFractionDigits:0}).format(+n||0);
const day=d=>d?new Date(d+'T12:00:00'):null,dleft=d=>d?Math.round((day(d)-new Date())/864e5):null;
const fdate=d=>d?day(d).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'2-digit'}):'—';
const rel=d=>{const n=dleft(d);return n===null?'':n<0?`vencida hace ${-n} d`:n===0?'hoy':n===1?'mañana':`en ${n} días`};
const ago=iso=>{const m=Math.floor((Date.now()-new Date(iso))/6e4);if(m<1)return'recién';if(m<60)return`hace ${m} min`;const h=Math.floor(m/60);if(h<24)return`hace ${h} h`;const d=Math.floor(h/24);return d===1?'ayer':`hace ${d} días`};
const paid=p=>p.pagos.reduce((a,x)=>a+(+x.monto||0),0),saldo=p=>Math.max(0,p.precio-paid(p)),fase=p=>Math.max(0,ETAPAS.indexOf(p.etapa));

 <h3>Estados de una propuesta</h3><ul>${EST.map(e=>`<li><b>${e}:</b> ${EHELP[e]}</li>`).join('')}</ul>
 <h3>Fases de un proyecto</h3><p>${ETAPAS.map(e=>`<b>${e}</b>`).join(' → ')}. Cada cambio queda anotado en la bitácora.</p>
 <h3>Preguntas comunes</h3><ul><li><b>¿Tengo que apretar «Guardar»?</b> En los proyectos no, se guarda solo. En las propuestas sí.</li><li><b>¿Desarrollo y abono se mezclan?</b> No. «Desarrollo» es el pago inicial (anticipo y saldo); el abono se registra mes a mes aparte.</li><li><b>¿Cuándo un abono está atrasado?</b> Después del día 10 del mes, si no lo registraste.</li><li><b>¿Y si un cliente da de baja el abono?</b> Destildá «Abono activo» en el proyecto. El historial queda guardado.</li><li><b>¿Se puede borrar algo por error?</b> Para borrar hay que tocar el botón dos veces.</li></ul></div>`}
function mLead(id){const l=L.find(x=>x.id===id);if(!l)return;
 const wa=waLink(l.whatsapp,`Hola ${primer(l.nombre)}, soy Octavio de Picture Web Dev. Recibí tu consulta por ${String(l.tipo||'tu web').toLowerCase()}. ¿Tenés unos minutos para charlarlo?`);
 modal(`<div class="mh"><div><h2>${esc(l.nombre)}</h2><small>${esc(l.tipo)} · ${ago(l.fecha)}</small></div><button class="x" data-x aria-label="Cerrar">×</button></div>
 <div class="nxt"><b>Qué hacer ahora:</b> ${NEXT[l.estado]}</div>
 <dl class="dl"><dt>Email</dt><dd><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></dd><dt>WhatsApp</dt><dd>${esc(l.whatsapp)||'—'}</dd><dt>Presupuesto</dt><dd>${esc(l.presupuesto)||'—'}</dd><dt>Plazo</dt><dd>${esc(l.plazo)||'—'}</dd><dt>Referencias</dt><dd>${esc(l.referencias)||'—'}</dd></dl>
 <h4>Lo que necesita</h4><div class="pre">${esc(l.descripcion)}</div>
 <div class="ba" style="margin:0 0 18px">${wa?`<a class="bt wa" target="_blank" rel="noopener" href="${esc(wa)}" data-contact="${id}">Responder por WhatsApp</a>`:''}<a class="bt o" href="mailto:${esc(l.email)}?subject=${encodeURIComponent('Tu consulta en Picture Web Dev')}">Responder por mail</a></div>
 <div class="fg"><label>Estado<select id="mEst">${EST.map(e=>`<option${e===l.estado?' selected':''}>${e}</option>`).join('')}</select></label><label class="full">Notas internas (solo las ves vos)<textarea id="mNot" rows="3" maxlength="3000">${esc(l.notas)}</textarea></label></div>
 <div class="ba"><button class="bt" data-sl="${id}">Guardar</button><button class="bt o" data-tp="${id}">${l.proyecto&&P.some(p=>p.id===l.proyecto)?'Ver proyecto':'Convertir en proyecto'}</button><button class="bt o d" data-dl="${id}" style="margin-left:auto">Borrar</button></div>`)}
const blank=()=>({id:uid(),nombre:'',cliente:'',email:'',whatsapp:'',tipo:TIPOS[0],etapa:ETAPAS[0],moneda:'USD',precio:0,cobrado:0,entrega:'',sitio:'',dominio:'',renovacion:'',notas:'',creado:new Date().toISOString(),lead:'',tareas:TAREAS.map(t=>({t,ok:false})),pagos:[],bitacora:[],plan:'',abono:0,abonoDesde:'',abonoActivo:true,mensual:[]});
function mNew(){modal(`<div class="mh"><h2>Nuevo proyecto</h2><button class="x" data-x aria-label="Cerrar">×</button></div><p class="hint2">Con esto alcanza para empezar. El resto lo completás dentro del proyecto.</p><div class="fg"><label class="full">Nombre del proyecto<input id="nn" placeholder="Ej: Web con turnos · Barbería Centro" maxlength="120"></label><label>Cliente<input id="nc" maxlength="120"></label><label>Plan<select id="npl"><option value="">Sin plan</option>${PLANES.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Precio del desarrollo<input id="npr" type="number" min="0" inputmode="numeric" placeholder="0"></label><label>Moneda<select id="nmo"><option>USD</option><option>ARS</option></select></label></div><div class="ba"><button class="bt" data-mk>Crear proyecto</button></div>`);$('#nn').focus()}
const applyPlan=(p,plan)=>{p.plan=plan;if(PLAN_ABONO[plan]&&p.moneda==='USD'&&!p.abono)p.abono=PLAN_ABONO[plan];if(p.abono&&!p.abonoDesde){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);p.abonoDesde=d.toISOString().slice(0,10)}};
async function toProject(id){const l=L.find(x=>x.id===id);if(l.proyecto&&P.some(p=>p.id===l.proyecto)){closeM();view='proyectos';pid=l.proyecto;return render()}
 const p={...blank(),nombre:`${l.tipo} · ${l.nombre}`,cliente:l.nombre,email:l.email,whatsapp:l.whatsapp,tipo:TIPOS.includes(l.tipo)?l.tipo:'Otro',notas:l.descripcion,lead:l.id};if(PLAN_DE_TIPO[l.tipo])applyPlan(p,PLAN_DE_TIPO[l.tipo]);log(p,'Proyecto creado a partir de una propuesta');log(p,'Lo que pidió el cliente: '+String(l.descripcion).slice(0,300));
 try{P.push(p);await saveP();Object.assign(l,await api('/api/lead',{method:'PATCH',body:{id:l.id,estado:'Aceptada',proyecto:p.id}}));closeM();view='proyectos';pid=p.id;render();toast('Proyecto creado. Completá el precio y la fecha de entrega.')}catch(e){P=P.filter(x=>x.id!==p.id);fail(e)}}
const setFase=(p,i)=>{if(i===fase(p))return;p.etapa=ETAPAS[i];log(p,`Pasó a la fase «${ETAPAS[i]}»`);render();queueSave()};
const addTask=()=>{const p=P.find(x=>x.id===pid),v=$('#nt').value.trim();if(!v)return;p.tareas.push({t:v,ok:false});render();queueSave();setTimeout(()=>{const n=$('#nt');n&&n.focus()},0)};
const regAbono=p=>{if(pagoMes(p))return;p.mensual.push({mes:mes(),monto:p.abono,fecha:tod()});log(p,`Abono de ${nomMes(mes())} cobrado · ${money(p.abono,p.moneda)}`);render();toast(`Abono de ${nomMes(mes())} registrado`)};

root.addEventListener('click',async e=>{const t=e.target,g=s=>t.closest(s);let a;
 if(t.id==='aMd'||g('[data-x]'))return closeM();
 if(a=g('[data-v]')){view=a.dataset.v;pid=null;return render()}
 if(g('[data-out]')){await fetch('/api/auth',{method:'DELETE'});logged=false;return location.reload()}
 if(g('[data-cp]')){const v=link();try{await navigator.clipboard.writeText(v);toast('Link copiado')}catch(_){const i=$('#lnk');i&&i.select();toast('Seleccioná el link y copialo')}return}
 if(g('[data-tipx]')){tipsHidden=true;try{localStorage.setItem('hzTips','1')}catch(_){}return render()}
 if(a=g('[data-fl]')){fl=a.dataset.fl;return render()}
 if(a=g('[data-pf]')){pf=a.dataset.pf;return render()}
 if(g('[data-np]'))return mNew();
 if(g('[data-mk]')){const n=$('#nn').value.trim(),c=$('#nc').value.trim();if(!n||!c)return toast('Completá el nombre del proyecto y el cliente.');const p={...blank(),nombre:n,cliente:c,precio:+$('#npr').value||0,moneda:$('#nmo').value};if($('#npl').value)applyPlan(p,$('#npl').value);log(p,'Proyecto creado');P.push(p);pid=p.id;view='proyectos';closeM();render();saveP().catch(fail);return}
 if(a=g('[data-contact]')){const l=L.find(x=>x.id===a.dataset.contact);if(l&&l.estado==='Nueva'){api('/api/lead',{method:'PATCH',body:{id:l.id,estado:'Contactada'}}).then(r=>{Object.assign(l,r);const s=$('#mEst');if(s)s.value='Contactada';toast('Marcada como «Contactada»')}).catch(()=>{})}return}
 if(a=g('[data-sl]')){try{Object.assign(L.find(x=>x.id===a.dataset.sl),await api('/api/lead',{method:'PATCH',body:{id:a.dataset.sl,estado:$('#mEst').value,notas:$('#mNot').value}}));closeM();render();toast('Guardado')}catch(x){fail(x)}return}
 if(a=g('[data-tp]'))return toProject(a.dataset.tp);
 if(a=g('[data-dl]')){if(!a.dataset.c){a.dataset.c=1;a.textContent='¿Seguro? Tocá de nuevo';return}try{await api('/api/lead?id='+a.dataset.dl,{method:'DELETE'});L=L.filter(x=>x.id!==a.dataset.dl);closeM();render()}catch(x){fail(x)}return}
 if(view==='abonos'&&(a=g('[data-am]'))){const p=P.find(x=>x.id===a.dataset.am);if(p){regAbono(p);saveP().catch(fail)}return}
 if(pid&&view==='proyectos'){const p=P.find(x=>x.id===pid);if(p){
  if(g('[data-bk]')){pid=null;return render()}
  if(a=g('[data-fase]'))return setFase(p,+a.dataset.fase);
  if(g('[data-next]'))return setFase(p,fase(p)+1);
  if(a=g('[data-t]')){p.tareas[+a.dataset.t].ok=a.checked;render();return queueSave()}
  if(a=g('[data-rt]')){p.tareas.splice(+a.dataset.rt,1);render();return queueSave()}
  if(g('[data-at]'))return addTask();
  if(g('[data-ab]')){const v=$('#nb').value.trim();if(!v)return toast('Escribí la nota primero.');log(p,v);render();return queueSave()}
  if(g('[data-ag]')){const m=+$('#pm').value;if(!(m>0))return toast('Escribí el monto cobrado.');const c=$('#pc').value.trim()||'Cobro';p.pagos.push({fecha:tod(),concepto:c,monto:m});log(p,`Cobro registrado: ${c} · ${money(m,p.moneda)}`);render();return queueSave()}
  if(a=g('[data-rg]')){p.pagos.splice(+a.dataset.rg,1);render();return queueSave()}
  if(g('[data-am]')){regAbono(p);return queueSave()}
  if(a=g('[data-rm]')){p.mensual=p.mensual.filter(x=>x.mes!==a.dataset.rm);render();return queueSave()}
  if(a=g('[data-aa]')){p.abonoActivo=a.checked;log(p,a.checked?'Abono reactivado':'Abono dado de baja');render();return queueSave()}
  if(a=g('[data-dp]')){if(!a.dataset.c){a.dataset.c=1;a.textContent='¿Seguro? Tocá de nuevo';return}P=P.filter(x=>x.id!==p.id);pid=null;render();saveP().catch(fail);return}
 }}
 if(a=g('[data-l]'))return mLead(a.dataset.l);
 if(a=g('[data-p]')){pid=a.dataset.p;view='proyectos';return render()}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nt'){e.preventDefault();return addTask()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[tabindex="0"]')){e.preventDefault();e.target.click()}});
const keepFocus=(id,fn)=>{const t=$('#'+id),pos=t.selectionStart;fn();const s=$('#'+id);s.focus();s.setSelectionRange(pos,pos)};
root.addEventListener('input',e=>{const t=e.target;
 if(t.id==='sq')return keepFocus('sq',()=>{q=t.value;render()});
 if(t.id==='lq')return keepFocus('lq',()=>{lq=t.value;render()});
 if(t.dataset&&t.dataset.f&&pid&&t.tagName==='INPUT'){const p=P.find(x=>x.id===pid);if(!p)return;p[t.dataset.f]=t.type==='number'?(+t.value||0):t.value;queueSave()}});
root.addEventListener('change',e=>{const t=e.target;if(!pid||!t.dataset||!t.dataset.f)return;const p=P.find(x=>x.id===pid);if(!p)return;
 if(t.tagName==='SELECT'){if(t.dataset.f==='plan'){applyPlan(p,t.value);if(t.value)log(p,`Plan: ${t.value}`)}else p[t.dataset.f]=t.value;render();queueSave()}
 else if(['abono','abonoDesde','precio'].includes(t.dataset.f))render()});
addEventListener('keydown',e=>e.key==='Escape'&&closeM());

async function load(){const [a,b]=await Promise.all([api('/api/projects'),api('/api/lead')]);P=a.projects||[];
 P.forEach(p=>{p.tareas=p.tareas||[];p.bitacora=p.bitacora||[];p.mensual=p.mensual||[];p.abono=+p.abono||0;p.abonoDesde=p.abonoDesde||'';p.plan=p.plan||'';if(p.abonoActivo===undefined)p.abonoActivo=true;if(p.etapa==='Por empezar')p.etapa=ETAPAS[0];if(!p.pagos)p.pagos=p.cobrado>0?[{fecha:(p.creado||'').slice(0,10)||tod(),concepto:'Cobrado hasta ahora',monto:p.cobrado}]:[]});
 L=(b.leads||[]).sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)));render()}
async function refresh(){if(!logged||$('#aMd').classList.contains('on')||(pid&&view==='proyectos')||document.activeElement&&/^(sq|lq)$/.test(document.activeElement.id))return;try{L=((await api('/api/lead')).leads||[]).sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)));const y=scrollY;render();scrollTo(0,y)}catch(_){}}
function showLogin(){logged=false;$('#aApp').classList.add('hid');$('#aLogin').classList.remove('hid');$('#lp').focus()}
async function boot(){const m=await fetch('/api/auth').then(r=>r.json()).catch(()=>({ok:false}));if(!m.ok)return showLogin();
 try{logged=true;await load();$('#aLogin').classList.add('hid');$('#aApp').classList.remove('hid')}catch(e){if(e!=='auth'){logged=false;toast('No se pudieron cargar los datos. Revisá la configuración de R2.')}}}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();$('#le').textContent='';const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#lp').value})}).catch(()=>null);
 if(r&&r.ok){$('#lp').value='';boot()}else $('#le').textContent=r&&r.status===500?'Falta configurar ADMIN_PASSWORD y SESSION_SECRET en Vercel.':'Contraseña incorrecta.'});
setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
boot();})();
</script></body></html>
