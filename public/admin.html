<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel · Estudio Norte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
.pa{--bg:#f5f5f2;--sf:#fff;--tx:#14161a;--mt:#656a73;--ac:#2b4cff;--bd:#dcdcd5;--ok:#1f8a58;--er:#c8433a;--se:'Bricolage Grotesque',system-ui,sans-serif;--sa:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--sa);min-height:100vh}
.pa *{box-sizing:border-box}
.pa h1,.pa h2,.pa h3{font-family:var(--se);font-weight:700;margin:0;line-height:1.1;letter-spacing:-.01em}
.pa input,.pa select,.pa textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:inherit}
.pa textarea{resize:vertical}
.pa input:focus,.pa select:focus,.pa textarea:focus,.pa button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pa label{display:grid;gap:5px;font-size:.82rem;font-weight:500;color:var(--mt)}
.pa .bt{display:inline-block;background:var(--tx);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:600 .9rem var(--sa);cursor:pointer;text-decoration:none;text-align:center}
.pa .bt:hover{background:var(--ac)}.pa .bt.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.pa .bt.o:hover{border-color:var(--tx)}.pa .bt.d{color:var(--er)}.pa .bt.s{padding:7px 12px;font-size:.8rem}.pa .bt:disabled{opacity:.5;cursor:default}
.pa .hid{display:none!important}
.pa #aLogin{max-width:380px;margin:18vh auto 0;padding:0 20px}.pa #aLogin h1{font-size:2.4rem;margin-bottom:6px}.pa #aLogin p{color:var(--mt);margin:0 0 18px}.pa #aLogin form{display:grid;gap:10px}.pa #le{color:var(--er);min-height:1.4em;font-size:.9rem}
.pa #aApp{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.pa aside{background:var(--tx);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.pa aside .br{font:700 1.2rem var(--se);padding:0 10px 18px}
.pa #aNav{flex:1;display:flex;flex-direction:column;gap:4px}.pa #aNav button{background:none;border:0;color:#e4e6eb;text-align:left;padding:10px 12px;border-radius:8px;font:600 .92rem var(--sa);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pa #aNav button small{display:block;color:#8d93a0;font-size:.72rem;font-weight:400;margin-top:1px}.pa #aNav button:hover{background:#23262c}.pa #aNav button.a{background:#fff;color:var(--tx)}.pa #aNav button.a small{color:#666}.pa #aNav b{background:var(--ac);color:#fff;border-radius:10px;padding:0 8px;font-size:.75rem}.pa #aNav .out{margin-top:auto;font-weight:500;color:#aab}
.pa main{padding:32px clamp(16px,4vw,48px);min-width:0;max-width:1180px}.pa main h1{font-size:2rem;margin-bottom:6px}.pa .hint{color:var(--mt);margin:0 0 22px;max-width:660px}
.pa .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pa .tip{background:#eef1ff;border:1px solid #cdd6ff;border-radius:12px;padding:18px;margin-bottom:22px}.pa .stps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0 14px}.pa .stps>div{background:#fff;border-radius:8px;padding:12px;font-size:.88rem;color:var(--mt)}.pa .stps>div>b{display:block;color:var(--ac);margin-bottom:2px}.pa .lnk{display:flex;gap:8px}
.pa .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}.pa .k{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}.pa .k small{color:var(--mt)}.pa .k b{display:block;font:700 1.6rem var(--se);margin-top:4px}
.pa .td{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}.pa .td:hover{border-color:var(--tx)}.pa .td>span:nth-child(2){flex:1}.pa .w{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:6px;min-width:86px;text-align:center}
.pa .w-Responder{background:#dfe6ff;color:#1b36b8}.pa .w-Entregar{background:#fde0dc;color:#9b2c22}.pa .w-Cobrar{background:#d3f0e1;color:#14663f}.pa .w-Renovar{background:#fdeccb;color:#8a5a00}
.pa .em{color:var(--mt);font-size:.92rem;padding:10px 0}.pa small{color:var(--mt)}
.pa .chs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.pa .ch{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;cursor:pointer;font:500 .84rem var(--sa);color:var(--tx)}.pa .ch.a{background:var(--tx);color:#fff;border-color:var(--tx)}
.pa .rw{display:grid;grid-template-columns:1.2fr 1.4fr auto auto;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}.pa .rw:hover{border-color:var(--tx)}
.pa .tg{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#e8e8e2}.pa .e-Nueva{background:#dfe6ff;color:#1b36b8}.pa .e-Contactada{background:#fdeccb;color:#8a5a00}.pa .e-Cotizada{background:#eadcff;color:#5a2db0}.pa .e-Aceptada{background:#d3f0e1;color:#14663f}.pa .e-Descartada{background:#e8e8e2;color:#666}
.pa .pr{display:grid;grid-template-columns:1.3fr 1.5fr 1.1fr 1fr;gap:18px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}.pa .pr:hover{border-color:var(--tx)}
.pa .dots{display:flex;gap:4px;margin-bottom:5px}.pa .dots i{flex:1;max-width:30px;height:6px;border-radius:3px;background:var(--bd)}.pa .dots i.on{background:var(--ac)}
.pa .pg{height:6px;background:var(--bd);border-radius:3px;margin:6px 0 4px}.pa .pg i{display:block;height:100%;background:var(--ok);border-radius:3px}.pa .late{color:var(--er);font-weight:600}
.pa .bk{background:none;border:0;color:var(--ac);cursor:pointer;font:600 .9rem var(--sa);padding:0;margin-bottom:12px}
.pa .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}.pa .dh input{font:700 1.9rem var(--se);border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-6px;width:min(620px,100%)}.pa .dh input:hover,.pa .dh input:focus{border-color:var(--bd);background:var(--sf)}.pa #sv{color:var(--mt);font-size:.82rem}
.pa .sp{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px 8px;margin-bottom:14px;overflow-x:auto}.pa .sp button{flex:1;min-width:110px;background:none;border:0;cursor:pointer;text-align:center;position:relative;padding:0 4px;font:500 .82rem var(--sa);color:var(--mt)}
.pa .sp button i{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 6px;border-radius:50%;background:var(--bd);color:#fff;font-style:normal;font-weight:700;position:relative;z-index:1}.pa .sp button.dn i{background:var(--ok)}.pa .sp button.cu i{background:var(--ac)}.pa .sp button.cu{color:var(--tx);font-weight:700}
.pa .sp button:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--bd)}.pa .sp button.dn:not(:last-child):after{background:var(--ok)}
.pa .ok2{color:var(--ok);font-weight:600;margin:0 0 18px}
.pa .dg{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}.pa .cdb{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}.pa .cdb h3{font-size:1.05rem;margin-bottom:10px}.pa .hint2{color:var(--mt);font-size:.85rem;margin:0 0 8px}
.pa .tk{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px}.pa .tk input[type=checkbox]{width:auto}.pa .tk.dn span{text-decoration:line-through;color:var(--mt)}.pa .tk.nx2{background:#eef1ff}
.pa .tl{border-left:2px solid var(--bd);margin:6px 0 0 6px;padding-left:14px}.pa .tl>div{margin-bottom:10px;font-size:.9rem}.pa .tl small{display:block}
.pa .mn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pa .mn>div{background:var(--bg);border-radius:8px;padding:8px 10px}.pa .mn small{display:block;font-size:.72rem}.pa .mn b{font:700 1.05rem var(--se)}
.pa .pgo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:.88rem}.pa .pf2{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:10px}
.pa .ayu h3{margin:22px 0 8px}.pa .ayu p,.pa .ayu li{color:var(--mt);max-width:680px}.pa .ayu b{color:var(--tx)}
.pa .md{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}.pa .md.on{display:flex}.pa .mb{background:var(--bg);width:min(740px,100%);border-radius:14px;padding:24px}
.pa .mh{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.pa .x{border:0;background:none;font-size:1.6rem;cursor:pointer;color:var(--tx);line-height:1}
.pa .dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:0 0 14px}.pa .dl dt{color:var(--mt)}.pa .dl dd{margin:0;word-break:break-word}.pa .dl a{color:var(--ac)}
.pa .pre{white-space:pre-wrap;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px;margin:6px 0 14px}.pa h4{margin:0;font-size:.85rem;color:var(--mt)}
.pa .nxt{background:#eef1ff;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.9rem}
.pa .ba{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pa .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}.pa .fg .full{grid-column:1/-1}
.pa #aTs{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none;font-size:.9rem}
@media(max-width:860px){.pa #aApp{grid-template-columns:1fr}.pa aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px}.pa aside .br,.pa #aNav button small{display:none}.pa #aNav{flex-direction:row}.pa #aNav .out{margin:0 0 0 auto}.pa .rw{grid-template-columns:1fr auto}.pa .pr{grid-template-columns:1fr}.pa .dg{grid-template-columns:1fr}.pa .pf2{grid-template-columns:1fr}}
</style></head>
<body class="pa" id="aRoot">
<div id="aLogin" class="hid"><h1>Panel</h1><p>Entrá con tu contraseña para ver tus proyectos y propuestas.</p><form id="lf"><input type="password" id="lp" placeholder="Contraseña" autocomplete="current-password" required><button class="bt">Entrar</button><div id="le"></div></form></div>
<div id="aApp" class="hid"><aside><div class="br">Picture Web Dev</div><nav id="aNav"></nav></aside><main id="aMain"></main></div>
<div id="aMd" class="md"><div class="mb" id="aMb"></div></div><div id="aTs"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),root=document.getElementById('aRoot');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ETAPAS=['Relevamiento','Diseño','Desarrollo','Revisión del cliente','Entregado'],EST=['Nueva','Contactada','Cotizada','Aceptada','Descartada'];
const EHELP={Nueva:'Nadie la miró todavía.',Contactada:'Ya le respondiste al cliente.',Cotizada:'Le mandaste un presupuesto.',Aceptada:'El cliente aceptó: ya es un proyecto.',Descartada:'No va a avanzar.'};
const NEXT={Nueva:'Respondele por mail o WhatsApp y después marcala como «Contactada».',Contactada:'Cuando le mandes el presupuesto, pasala a «Cotizada».',Cotizada:'Si el cliente acepta, convertila en proyecto con el botón de abajo.',Aceptada:'Esta propuesta ya está en tus proyectos.',Descartada:'No va a avanzar. Podés dejarla de registro o borrarla.'};
const TIPOS=['Sitio institucional','Tienda online','Landing page','Sistema a medida','Rediseño de un sitio existente','Otro'];
const TAREAS=['Reunión de relevamiento','Anticipo cobrado','Diseño aprobado','Desarrollo','Contenido cargado','Dominio y hosting','Publicación','Entrega al cliente'];
let P=[],L=[],view='hoy',pid=null,fl='',pf='curso',q='',logged=false,svt,tipsHidden=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tod=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const money=(n,m)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:m==='USD'?'USD':'ARS',maximumFractionDigits:0}).format(+n||0);
const day=d=>d?new Date(d+'T12:00:00'):null,dleft=d=>d?Math.round((day(d)-new Date())/864e5):null;
const fdate=d=>d?day(d).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'2-digit'}):'—';
const rel=d=>{const n=dleft(d);return n===null?'':n<0?`vencida hace ${-n} d`:n===0?'hoy':n===1?'mañana':`en ${n} días`};
const ago=iso=>{const m=Math.floor((Date.now()-new Date(iso))/6e4);if(m<1)return'recién';if(m<60)return`hace ${m} min`;const h=Math.floor(m/60);if(h<24)return`hace ${h} h`;const d=Math.floor(h/24);return d===1?'ayer':`hace ${d} días`};
const paid=p=>p.pagos.reduce((a,x)=>a+(+x.monto||0),0),saldo=p=>Math.max(0,p.precio-paid(p)),fase=p=>Math.max(0,ETAPAS.indexOf(p.etapa));
const log=(p,t)=>p.bitacora.unshift({fecha:new Date().toISOString(),texto:t});
let tt;const toast=m=>{const t=$('#aTs');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)};
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});if(r.status===401){showLogin();throw'auth'}if(!r.ok)throw r;return r.json()};
const saveP=()=>api('/api/projects',{method:'PUT',body:{projects:P}});
const fail=e=>{if(e!=='auth')toast('No se pudo guardar. Probá de nuevo.')};
const modal=h=>{$('#aMb').innerHTML=h;$('#aMd').classList.add('on')},closeM=()=>$('#aMd').classList.remove('on');
const tipsOff=()=>{try{return tipsHidden||localStorage.getItem('hzTips')==='1'}catch(_){return tipsHidden}};
const link=()=>location.origin+'/';
function queueSave(){const s=$('#sv');if(s)s.textContent='Guardando…';clearTimeout(svt);svt=setTimeout(async()=>{try{await saveP();const s=$('#sv');if(s)s.textContent='Todos los cambios guardados'}catch(e){fail(e);const s=$('#sv');if(s)s.textContent='No se pudo guardar'}},700)}

function render(){const nu=L.filter(l=>l.estado==='Nueva').length,act=P.filter(p=>p.etapa!=='Entregado').length;document.title=(nu?`(${nu}) `:'')+'Panel · Estudio Norte';
 $('#aNav').innerHTML=[['hoy','Hoy','Lo que necesita tu atención'],['propuestas','Propuestas','Lo que te escriben los clientes',nu],['proyectos','Proyectos','Lo que estás haciendo',act],['ayuda','Ayuda','Cómo funciona todo']].map(([k,t,s,n])=>`<button class="${view===k?'a':''}" data-v="${k}"><span>${t}<small>${s}</small></span>${n?`<b>${n}</b>`:''}</button>`).join('')+'<button class="out" data-out>Salir</button>';
 $('#aMain').innerHTML={hoy:vHoy,propuestas:vProp,proyectos:vProy,ayuda:vAyuda}[view]()}
const sums=f=>{const o={};P.forEach(p=>{const v=f(p);if(v>0)o[p.moneda]=(o[p.moneda]||0)+v});return Object.entries(o).map(([m,v])=>money(v,m)).join(' + ')||'—'};
const linkRow=()=>`<div class="lnk"><input id="lnk" readonly value="${esc(link())}" aria-label="Link del formulario"><button class="bt s" data-cp>Copiar</button></div>`;
function todo(){const t=[];
 L.filter(l=>l.estado==='Nueva').forEach(l=>t.push({o:0,k:'Responder',a:`data-l="${l.id}"`,x:`<b>${esc(l.nombre)}</b> pidió ${esc(l.tipo.toLowerCase())}`,r:ago(l.fecha)}));
 P.filter(p=>p.etapa!=='Entregado'&&p.entrega&&dleft(p.entrega)<=7).forEach(p=>t.push({o:1,k:'Entregar',a:`data-p="${p.id}"`,x:`<b>${esc(p.nombre)}</b>`,r:rel(p.entrega),late:dleft(p.entrega)<0}));
 P.filter(p=>p.etapa==='Entregado'&&saldo(p)>0).forEach(p=>t.push({o:2,k:'Cobrar',a:`data-p="${p.id}"`,x:`<b>${esc(p.nombre)}</b> · falta cobrar ${money(saldo(p),p.moneda)}`,r:''}));
 P.filter(p=>p.renovacion&&dleft(p.renovacion)<=30).forEach(p=>t.push({o:3,k:'Renovar',a:`data-p="${p.id}"`,x:`<b>${esc(p.dominio||p.nombre)}</b> de ${esc(p.cliente)}`,r:rel(p.renovacion),late:dleft(p.renovacion)<0}));
 return t.sort((a,b)=>a.o-b.o)}
function vHoy(){const act=P.filter(p=>p.etapa!=='Entregado'),nu=L.filter(l=>l.estado==='Nueva'),t=todo();
 return `<h1>Hoy</h1><p class="hint">Acá ves lo que necesita tu atención. Si la lista está vacía, estás al día.</p>
 ${tipsOff()?'':`<div class="tip"><b>Primeros pasos</b><div class="stps"><div><b>1. Compartí tu formulario</b>Mandales este link a tus clientes o ponelo en tu web.<div style="margin-top:8px">${linkRow()}</div></div><div><b>2. Mirá las propuestas</b>Cuando alguien completa el formulario, aparece en «Propuestas».</div><div><b>3. Convertila en proyecto</b>Con un botón: se copian los datos del cliente y se arma una lista de tareas.</div><div><b>4. Seguí tu trabajo</b>Avanzá las fases, tildá tareas y registrá cobros. Todo se guarda solo.</div></div><button class="bt o s" data-tipx>Entendido, ocultar esto</button> <button class="bt o s" data-v="ayuda">Ver la ayuda completa</button></div>`}
 <div class="kp"><div class="k"><small>Propuestas nuevas</small><b>${nu.length}</b></div><div class="k"><small>Proyectos en curso</small><b>${act.length}</b></div><div class="k"><small>Falta cobrar</small><b>${sums(saldo)}</b></div><div class="k"><small>Cobrado en total</small><b>${sums(paid)}</b></div></div>
 <h3 style="margin-bottom:10px">Para hacer hoy</h3>${t.map(i=>`<div class="td" ${i.a}><span class="w w-${i.k}">${i.k}</span><span>${i.x}</span><small class="${i.late?'late':''}">${i.r}</small></div>`).join('')||'<div class="em">Todo al día. Cuando entre una propuesta o se acerque una fecha de entrega o de renovación, aparece acá.</div>'}`}
function vProp(){const cnt=e=>L.filter(l=>l.estado===e).length,l=L.filter(x=>!fl||x.estado===fl);
 return `<h1>Propuestas</h1><p class="hint">Cada vez que un cliente completa tu formulario, llega acá. Tocá una para leerla, responderle y cambiar su estado. Las nuevas aparecen primero.</p><div class="chs"><button class="ch ${fl?'':'a'}" data-fl="">Todas (${L.length})</button>${EST.map(e=>`<button class="ch ${fl===e?'a':''}" data-fl="${e}" title="${EHELP[e]}">${e} (${cnt(e)})</button>`).join('')}</div>`+
 (l.map(x=>`<div class="rw" data-l="${x.id}"><div><b>${esc(x.nombre)}</b><br><small>${esc(x.email)}</small></div><div>${esc(x.tipo)}<br><small>${esc(x.presupuesto||'')}</small></div><span class="tg e-${x.estado}">${x.estado}</span><small>${ago(x.fecha)}</small></div>`).join('')||`<div class="em">${L.length?'No hay propuestas con este estado.':'Todavía no recibiste propuestas. Compartí el link de tu formulario para que lleguen:'}</div>${L.length?'':linkRow()}`)}
function prow(p){const f=fase(p),pc=p.precio?Math.min(100,Math.round(paid(p)/p.precio*100)):0,d=dleft(p.entrega),nt=(p.tareas.find(t=>!t.ok)||{}).t,fin=p.etapa==='Entregado';
 return `<div class="pr" data-p="${p.id}"><div><b>${esc(p.nombre)}</b><br><small>${esc(p.cliente)}</small></div><div><div class="dots">${ETAPAS.map((_,i)=>`<i class="${i<=f?'on':''}"></i>`).join('')}</div><small><b>${p.etapa}</b>${nt&&!fin?` · Sigue: ${esc(nt)}`:''}</small></div><div><div class="pg"><i style="width:${pc}%"></i></div><small>Cobrado ${money(paid(p),p.moneda)} de ${money(p.precio,p.moneda)}</small></div><div>${fin?'<small>Entregado</small>':p.entrega?`<b class="${d<0?'late':''}">${fdate(p.entrega)}</b><br><small>${rel(p.entrega)}</small>`:'<small>Sin fecha de entrega</small>'}</div></div>`}
function vProy(){if(pid){const p=P.find(x=>x.id===pid);if(p)return vDet(p);pid=null}
 const cur=P.filter(p=>p.etapa!=='Entregado'),ent=P.filter(p=>p.etapa==='Entregado');let l=pf==='curso'?cur:pf==='entregados'?ent:P;
 if(q)l=l.filter(p=>(p.nombre+' '+p.cliente+' '+p.dominio).toLowerCase().includes(q.toLowerCase()));l=[...l].sort((a,b)=>(a.entrega||'9999').localeCompare(b.entrega||'9999'));
 return `<div class="top"><h1>Proyectos</h1><button class="bt" data-np>+ Nuevo proyecto</button></div><p class="hint">Cada fila es un proyecto. Tocá uno para ver sus fases, tareas, cobros y notas. Arriba van los que se entregan antes.</p>
 <div class="chs"><button class="ch ${pf==='curso'?'a':''}" data-pf="curso">En curso (${cur.length})</button><button class="ch ${pf==='entregados'?'a':''}" data-pf="entregados">Entregados (${ent.length})</button><button class="ch ${pf==='todos'?'a':''}" data-pf="todos">Todos (${P.length})</button><input id="sq" placeholder="Buscar por nombre, cliente o dominio" value="${esc(q)}" style="max-width:300px;margin-left:auto"></div>`+
 (l.map(prow).join('')||`<div class="em">${P.length?'No hay proyectos con ese filtro.':'Todavía no tenés proyectos. Creá uno con «Nuevo proyecto» o convertí una propuesta.'}</div>`)}
function vDet(p){const f=fase(p),sd=saldo(p),pc=p.precio?Math.min(100,Math.round(paid(p)/p.precio*100)):0,done=p.tareas.filter(t=>t.ok).length,nx=p.tareas.findIndex(t=>!t.ok),wa=String(p.whatsapp||'').replace(/\D/g,'');
 const fi=(k,l,t='text',x='')=>`<label>${l}<input data-f="${k}" type="${t}" value="${esc(p[k])}" ${x}></label>`;
 return `<button class="bk" data-bk>← Todos los proyectos</button>
 <div class="dh"><div><input data-f="nombre" value="${esc(p.nombre)}" aria-label="Nombre del proyecto" maxlength="120"><div><small>Cliente: ${esc(p.cliente)}</small></div></div><span id="sv">Los cambios se guardan solos</span></div>
 <div class="sp">${ETAPAS.map((e,i)=>`<button class="${i<f?'dn':i===f?'cu':''}" data-fase="${i}"><i>${i<f?'✓':i+1}</i>${e}</button>`).join('')}</div>
 ${f<4?`<p style="margin:0 0 18px"><button class="bt" data-next>Pasar a «${ETAPAS[f+1]}» →</button> <small>También podés tocar una fase de arriba para saltar a ella.</small></p>`:`<p class="ok2">Proyecto entregado. ${sd>0?`Falta cobrar ${money(sd,p.moneda)}.`:'Está todo cobrado.'}</p>`}
 <div class="dg"><div>
 <div class="cdb"><h3>Tareas · ${done} de ${p.tareas.length}</h3>${p.tareas.map((t,i)=>`<div class="tk ${t.ok?'dn':i===nx?'nx2':''}"><input type="checkbox" data-t="${i}" ${t.ok?'checked':''} aria-label="${esc(t.t)}"><span style="flex:1">${esc(t.t)}${i===nx?' <small>← lo que sigue</small>':''}</span><button class="bt o s" data-rt="${i}" aria-label="Quitar tarea">×</button></div>`).join('')||'<div class="em">Sin tareas. Agregá la primera acá abajo.</div>'}<div class="tk" style="margin-top:6px"><input type="text" id="nt" placeholder="Nueva tarea (Enter para agregar)" maxlength="200"><button class="bt o s" data-at>Agregar</button></div></div>
 <div class="cdb"><h3>Bitácora</h3><p class="hint2">Anotá lo que pasa: llamadas, pedidos del cliente, decisiones. Los cambios de fase y los cobros se anotan solos.</p><textarea id="nb" rows="2" placeholder="Ej: El cliente pidió cambiar el logo" maxlength="500"></textarea><p style="margin:8px 0 14px"><button class="bt s" data-ab>Agregar nota</button></p><div class="tl">${p.bitacora.map(b=>`<div><small>${ago(b.fecha)}</small>${esc(b.texto)}</div>`).join('')||'<small>Todavía no hay notas.</small>'}</div></div>
 </div><div>
 <div class="cdb"><h3>Cobros</h3><div class="mn"><div><small>Precio total</small><b>${money(p.precio,p.moneda)}</b></div><div><small>Cobrado</small><b>${money(paid(p),p.moneda)}</b></div><div><small>Falta cobrar</small><b>${money(sd,p.moneda)}</b></div></div><div class="pg"><i style="width:${pc}%"></i></div>
 ${p.pagos.map((g,i)=>`<div class="pgo"><span>${fdate(g.fecha)} · ${esc(g.concepto)}</span><span><b>${money(g.monto,p.moneda)}</b> <button class="bt o s" data-rg="${i}" aria-label="Quitar cobro">×</button></span></div>`).join('')}
 <div class="pf2"><input id="pc" list="cps" placeholder="Concepto (ej: Anticipo)" maxlength="60"><datalist id="cps"><option>Anticipo</option><option>Segunda cuota</option><option>Saldo final</option></datalist><input id="pm" type="number" min="0" placeholder="Monto"><button class="bt s" data-ag>Registrar cobro</button></div>
 <div class="fg" style="margin-top:12px">${fi('precio','Precio total','number','min="0"')}<label>Moneda<select data-f="moneda"><option${p.moneda==='ARS'?' selected':''}>ARS</option><option${p.moneda==='USD'?' selected':''}>USD</option></select></label></div></div>
 <div class="cdb"><h3>Datos del proyecto</h3><div class="fg">${fi('cliente','Cliente')}${fi('email','Email','email')}${fi('whatsapp','WhatsApp')}<label>Tipo<select data-f="tipo">${TIPOS.map(x=>`<option${x===p.tipo?' selected':''}>${x}</option>`).join('')}</select></label>${fi('entrega','Fecha de entrega','date')}${fi('dominio','Dominio')}${fi('renovacion','Renovación de dominio u hosting','date')}${fi('sitio','Link del sitio','url')}</div>
 <div class="ba">${wa?`<a class="bt o s" target="_blank" rel="noopener" href="https://wa.me/${wa}">WhatsApp</a>`:''}${p.email?`<a class="bt o s" href="mailto:${esc(p.email)}">Mail</a>`:''}${/^https?:\/\//.test(p.sitio)?`<a class="bt o s" target="_blank" rel="noopener" href="${esc(p.sitio)}">Abrir sitio</a>`:''}</div></div>
 <button class="bt o s d" data-dp>Borrar proyecto</button></div></div>`}
function vAyuda(){return `<h1>Ayuda</h1><p class="hint">Una guía corta de cómo se usa todo esto.</p><div class="ayu">
 <h3>El recorrido completo</h3><ol><li><b>Tu cliente completa el formulario.</b> Este es el link para compartir: <div style="margin:8px 0">${linkRow()}</div></li><li><b>La propuesta llega a «Propuestas».</b> La leés, le respondés y vas cambiando su estado.</li><li><b>Si el cliente acepta, la convertís en proyecto</b> con un botón.</li><li><b>En «Proyectos» llevás el trabajo:</b> fases, tareas, cobros y notas.</li><li><b>«Hoy» te recuerda lo urgente:</b> propuestas sin responder, entregas cerca, cobros pendientes y renovaciones.</li></ol>
 <h3>Qué significa cada estado de una propuesta</h3><ul>${EST.map(e=>`<li><b>${e}:</b> ${EHELP[e]}</li>`).join('')}</ul>
 <h3>Las fases de un proyecto</h3><p>${ETAPAS.map(e=>`<b>${e}</b>`).join(' → ')}. Con «Pasar a la siguiente fase» avanzás, o tocás una fase para saltar. Cada cambio queda anotado solo en la bitácora.</p>
 <h3>Preguntas comunes</h3><ul><li><b>¿Tengo que apretar «Guardar»?</b> En los proyectos no: todo se guarda solo y arriba a la derecha lo ves. En las propuestas sí, con el botón Guardar.</li><li><b>¿Cómo registro un pago?</b> Dentro del proyecto, en «Cobros»: escribís el concepto y el monto. El saldo se calcula solo.</li><li><b>¿Dónde cargo cuándo vence el dominio?</b> En «Datos del proyecto», campo «Renovación». 30 días antes aparece en «Hoy».</li><li><b>¿Cómo sé que llegó algo nuevo?</b> La pestaña del navegador muestra cuántas propuestas nuevas hay y el panel se actualiza solo cada minuto.</li><li><b>¿Se puede borrar algo por error?</b> Para borrar hay que tocar el botón dos veces.</li></ul></div>`}
function mLead(id){const l=L.find(x=>x.id===id);if(!l)return;const wa=String(l.whatsapp||'').replace(/\D/g,'');
 modal(`<div class="mh"><div><h2>${esc(l.nombre)}</h2><small>${esc(l.tipo)} · ${ago(l.fecha)}</small></div><button class="x" data-x aria-label="Cerrar">×</button></div>
 <div class="nxt"><b>Qué hacer ahora:</b> ${NEXT[l.estado]}</div>
 <dl class="dl"><dt>Email</dt><dd><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></dd><dt>WhatsApp</dt><dd>${wa?`<a target="_blank" rel="noopener" href="https://wa.me/${wa}">${esc(l.whatsapp)}</a>`:'—'}</dd><dt>Presupuesto</dt><dd>${esc(l.presupuesto)}</dd><dt>Plazo</dt><dd>${esc(l.plazo)}</dd><dt>Referencias</dt><dd>${esc(l.referencias)||'—'}</dd></dl>
 <h4>Lo que necesita</h4><div class="pre">${esc(l.descripcion)}</div>
 <div class="fg"><label>Estado<select id="mEst">${EST.map(e=>`<option${e===l.estado?' selected':''}>${e}</option>`).join('')}</select></label><label class="full">Notas internas (solo las ves vos)<textarea id="mNot" rows="3" maxlength="3000">${esc(l.notas)}</textarea></label></div>
 <div class="ba"><button class="bt" data-sl="${id}">Guardar</button><button class="bt o" data-tp="${id}">${l.proyecto&&P.some(p=>p.id===l.proyecto)?'Ver proyecto':'Convertir en proyecto'}</button><a class="bt o" href="mailto:${esc(l.email)}?subject=${encodeURIComponent('Tu propuesta de '+l.tipo)}">Responder por mail</a>${wa?`<a class="bt o" target="_blank" rel="noopener" href="https://wa.me/${wa}">WhatsApp</a>`:''}<button class="bt o d" data-dl="${id}">Borrar</button></div>`)}
const blank=()=>({id:uid(),nombre:'',cliente:'',email:'',whatsapp:'',tipo:TIPOS[0],etapa:ETAPAS[0],moneda:'ARS',precio:0,cobrado:0,entrega:'',sitio:'',dominio:'',renovacion:'',notas:'',creado:new Date().toISOString(),lead:'',tareas:TAREAS.map(t=>({t,ok:false})),pagos:[],bitacora:[]});
function mNew(){modal(`<div class="mh"><h2>Nuevo proyecto</h2><button class="x" data-x aria-label="Cerrar">×</button></div><p class="hint2">Con estos datos alcanza para empezar. El resto lo completás dentro del proyecto.</p><div class="fg"><label class="full">Nombre del proyecto<input id="nn" placeholder="Ej: Tienda online · Ferretería Sur" maxlength="120"></label><label>Cliente<input id="nc" maxlength="120"></label><label>Tipo<select id="ntp">${TIPOS.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Precio total<input id="npr" type="number" min="0" placeholder="0"></label><label>Moneda<select id="nmo"><option>ARS</option><option>USD</option></select></label></div><div class="ba"><button class="bt" data-mk>Crear proyecto</button></div>`);$('#nn').focus()}
async function toProject(id){const l=L.find(x=>x.id===id);if(l.proyecto&&P.some(p=>p.id===l.proyecto)){closeM();view='proyectos';pid=l.proyecto;return render()}
 const p={...blank(),nombre:`${l.tipo} · ${l.nombre}`,cliente:l.nombre,email:l.email,whatsapp:l.whatsapp,tipo:l.tipo,notas:l.descripcion,lead:l.id};log(p,'Proyecto creado a partir de una propuesta');log(p,'Lo que pidió el cliente: '+l.descripcion.slice(0,300));
 try{P.push(p);await saveP();Object.assign(l,await api('/api/lead',{method:'PATCH',body:{id:l.id,estado:'Aceptada',proyecto:p.id}}));closeM();view='proyectos';pid=p.id;render();toast('Proyecto creado. Completá el precio y la fecha de entrega.')}catch(e){P=P.filter(x=>x.id!==p.id);fail(e)}}
const setFase=(p,i)=>{if(i===fase(p))return;p.etapa=ETAPAS[i];log(p,`Pasó a la fase «${ETAPAS[i]}»`);render();queueSave()};
const addTask=()=>{const p=P.find(x=>x.id===pid),v=$('#nt').value.trim();if(!v)return;p.tareas.push({t:v,ok:false});render();queueSave();setTimeout(()=>{const n=$('#nt');n&&n.focus()},0)};

root.addEventListener('click',async e=>{const t=e.target,g=s=>t.closest(s);let a;
 if(t.id==='aMd'||g('[data-x]'))return closeM();
 if(a=g('[data-v]')){view=a.dataset.v;pid=null;return render()}
 if(g('[data-out]')){await fetch('/api/auth',{method:'DELETE'});logged=false;return location.reload()}
 if(g('[data-cp]')){const v=link();try{await navigator.clipboard.writeText(v);toast('Link copiado')}catch(_){const i=$('#lnk');i&&i.select();toast('Seleccioná el link y copialo (Ctrl+C)')}return}
 if(g('[data-tipx]')){tipsHidden=true;try{localStorage.setItem('hzTips','1')}catch(_){}return render()}
 if(a=g('[data-fl]')){fl=a.dataset.fl;return render()}
 if(a=g('[data-pf]')){pf=a.dataset.pf;return render()}
 if(g('[data-np]'))return mNew();
 if(g('[data-mk]')){const n=$('#nn').value.trim(),c=$('#nc').value.trim();if(!n||!c)return toast('Completá el nombre del proyecto y el cliente.');const p={...blank(),nombre:n,cliente:c,tipo:$('#ntp').value,precio:+$('#npr').value||0,moneda:$('#nmo').value};log(p,'Proyecto creado');P.push(p);pid=p.id;view='proyectos';closeM();render();saveP().catch(fail);return}
 if(a=g('[data-sl]')){try{Object.assign(L.find(x=>x.id===a.dataset.sl),await api('/api/lead',{method:'PATCH',body:{id:a.dataset.sl,estado:$('#mEst').value,notas:$('#mNot').value}}));closeM();render();toast('Guardado')}catch(x){fail(x)}return}
 if(a=g('[data-tp]'))return toProject(a.dataset.tp);
 if(a=g('[data-dl]')){if(!a.dataset.c){a.dataset.c=1;a.textContent='¿Seguro? Tocá de nuevo';return}try{await api('/api/lead?id='+a.dataset.dl,{method:'DELETE'});L=L.filter(x=>x.id!==a.dataset.dl);closeM();render()}catch(x){fail(x)}return}
 if(pid&&view==='proyectos'){const p=P.find(x=>x.id===pid);if(p){
  if(g('[data-bk]')){pid=null;return render()}
  if(a=g('[data-fase]'))return setFase(p,+a.dataset.fase);
  if(g('[data-next]'))return setFase(p,fase(p)+1);
  if(a=g('[data-t]')){p.tareas[+a.dataset.t].ok=a.checked;render();return queueSave()}
  if(a=g('[data-rt]')){p.tareas.splice(+a.dataset.rt,1);render();return queueSave()}
  if(g('[data-at]'))return addTask();
  if(g('[data-ab]')){const v=$('#nb').value.trim();if(!v)return toast('Escribí la nota primero.');log(p,v);render();return queueSave()}
  if(g('[data-ag]')){const m=+$('#pm').value;if(!(m>0))return toast('Escribí el monto cobrado.');const c=$('#pc').value.trim()||'Cobro';p.pagos.push({fecha:tod(),concepto:c,monto:m});log(p,`Cobro registrado: ${c} · ${money(m,p.moneda)}`);render();return queueSave()}
  if(a=g('[data-rg]')){p.pagos.splice(+a.dataset.rg,1);render();return queueSave()}
  if(a=g('[data-dp]')){if(!a.dataset.c){a.dataset.c=1;a.textContent='¿Seguro? Tocá de nuevo';return}P=P.filter(x=>x.id!==p.id);pid=null;render();saveP().catch(fail);return}
 }}
 if(a=g('[data-l]'))return mLead(a.dataset.l);
 if(a=g('[data-p]')){pid=a.dataset.p;view='proyectos';return render()}});
root.addEventListener('input',e=>{const t=e.target;
 if(t.id==='sq'){q=t.value;const pos=t.selectionStart;render();const s=$('#sq');s.focus();s.setSelectionRange(pos,pos);return}
 if(t.dataset&&t.dataset.f&&pid){const p=P.find(x=>x.id===pid);if(!p)return;p[t.dataset.f]=t.type==='number'?(+t.value||0):t.value;queueSave()}});
root.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.f&&pid){const p=P.find(x=>x.id===pid);if(p){p[t.dataset.f]=t.value;if(t.dataset.f==='moneda')render();queueSave()}}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nt'){e.preventDefault();addTask()}});
addEventListener('keydown',e=>e.key==='Escape'&&closeM());

async function load(){const [a,b]=await Promise.all([api('/api/projects'),api('/api/lead')]);P=a.projects||[];
 P.forEach(p=>{p.tareas=p.tareas||[];p.bitacora=p.bitacora||[];if(p.etapa==='Por empezar')p.etapa=ETAPAS[0];if(!p.pagos)p.pagos=p.cobrado>0?[{fecha:(p.creado||'').slice(0,10)||tod(),concepto:'Cobrado hasta ahora',monto:p.cobrado}]:[]});L=b.leads||[];render()}
async function refresh(){if(!logged||$('#aMd').classList.contains('on')||(pid&&view==='proyectos'))return;try{L=(await api('/api/lead')).leads||[];render()}catch(_){}}
function showLogin(){logged=false;$('#aApp').classList.add('hid');$('#aLogin').classList.remove('hid');$('#lp').focus()}
async function boot(){const m=await fetch('/api/auth').then(r=>r.json()).catch(()=>({ok:false}));if(!m.ok)return showLogin();
 try{logged=true;await load();$('#aLogin').classList.add('hid');$('#aApp').classList.remove('hid')}catch(e){if(e!=='auth'){logged=false;toast('No se pudieron cargar los datos. Revisá la configuración de R2.')}}}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();$('#le').textContent='';const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#lp').value})}).catch(()=>null);
 if(r&&r.ok){$('#lp').value='';boot()}else $('#le').textContent=r&&r.status===500?'Falta configurar ADMIN_PASSWORD y SESSION_SECRET en Vercel.':'Contraseña incorrecta.'});
setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.__refresh=refresh;
boot();})();

</script></body></html>
